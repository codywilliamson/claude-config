name: Commitlint

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions: {}

concurrency:
  group: commitlint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    # pinned by SHA like every other action here: a tag can be moved, a commit
    # cannot. bump this deliberately rather than tracking a branch.
    uses: codywilliamson/commit-guard/.github/workflows/commitlint.yml@19722990be935f2f3244c8843d524d99401262f8 # v0.3.1
    with:
      config: conventional
      # smart: lint real commits, skip bot noise, fall back to the PR title
      # when every commit in the range was skipped
      pr-mode: smart
    permissions:
      contents: read
