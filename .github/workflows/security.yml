name: security

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # a dependency-free repo still rots: new zizmor and gitleaks rules land, and
    # a payload committed today should be caught even if nobody pushes again
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  content:
    name: prompt injection + shell patterns
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # invisible unicode is the one a human reviewer cannot catch: a payload in
      # the Unicode Tag block renders as nothing but is still tokens to a model.
      # https://embracethered.com/blog/posts/2026/scary-agent-skills/
      - name: scan skills, hooks and settings
        run: node scripts/scan-content.mjs

  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # gitleaks scans history, not just the tip
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # no GITLEAKS_LICENSE needed: free for personal-account repos

  actions:
    name: zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # the workflows are themselves attack surface — unpinned actions, wide
      # permissions, template injection. audit them the same as everything else.
      - name: install zizmor
        run: pipx install zizmor==1.29.0

      - name: audit workflows
        run: zizmor --persona=pedantic .github/workflows/
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
